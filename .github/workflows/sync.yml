name: Sync

on:
  schedule:
    # Weekly, on a minute nobody else picks. The guide changes a few times a
    # year; anything more frequent is load on Google for no benefit.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  # Nothing reaches the mirror until the code that writes it passes its own
  # tests and linters.
  checks:
    uses: ./.github/workflows/ci.yml

  sync:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # Fails on the first unreachable page, and writes nothing in that case.
      - name: Fetch the guide and regenerate the mirror
        run: uv run gdsm

      # A table of contents that renders short would otherwise be indistinguishable
      # from Google deleting most of the guide. Deleting a few pages is normal;
      # deleting a quarter of them is a bug somewhere, and needs a human.
      - name: Refuse a suspicious deletion
        run: |
          removed=$(git diff --name-only --diff-filter=D -- docs | wc -l)
          tracked=$(git ls-files -- docs | wc -l)
          if [ "$removed" -gt "$((tracked / 4))" ]; then
            echo "::error::sync would delete $removed of $tracked documents, refusing to push"
            exit 1
          fi
          echo "$removed of $tracked documents would be deleted"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs llms.txt llms-full.txt
          # An `if` rather than `&&`: run steps are bash -e, and --quiet exits 1
          # when there is something staged, which is the case we want to push.
          if git diff --cached --quiet; then
            echo 'the guide has not changed'
            exit 0
          fi

          # Only docs/ is summarised. llms.txt and llms-full.txt are derived from
          # it, so listing them would restate the summary at ten times the size.
          # awk prints 0 for a status letter it never saw.
          pages=$(git diff --cached --name-status -- docs)
          counts=$(awk '{n[$1]++}
                        END {printf "%d changed, %d added, %d removed", n["M"], n["A"], n["D"]}' <<<"$pages")

          # Google keeps its own changelog, so quote the lines it gained rather
          # than describe the diff. Nothing is written when the page is
          # untouched, deleted, or gone: there are no added lines to quote.
          #
          # 40 lines is a ceiling only a first sync can reach, where the whole
          # page arrives as one block. Of the 172 milestones the page has
          # published, the median is 5 lines and the largest ever is 28.
          news=$(git diff --cached -U0 -- docs/whats-new.md |
                 grep '^+' | grep -v '^+++' | cut -c2- |
                 awk 'NR <= 40 {print} NR == 41 {print "... and more; see the diff"; exit}' || true)
          body="$pages"
          if [ -n "$news" ]; then
            body=$(printf '%s\n\nLines added to docs/whats-new.md:\n\n%s' "$body" "$news")
          fi

          git diff --cached --stat
          git commit -m "docs: sync the guide ($counts)" -m "$body"
          git push
