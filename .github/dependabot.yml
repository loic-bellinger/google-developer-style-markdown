# No pre-commit ecosystem: the hooks in prek.toml are built into prek or run
# their tools through `uv run`, so the uv updates below cover every version
# they use.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      python:
        patterns: ["*"]
