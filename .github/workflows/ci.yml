name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when this workflow is reused, so a
  # scheduled sync and a push to main do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # --locked fails rather than silently resolving something new, so CI runs
      # the exact versions in uv.lock.
      - name: Install
        run: uv sync --locked

      - name: Lint Python
        run: uv run ruff check --output-format=github

      - name: Check Python formatting
        run: uv run ruff format --check --diff

      # Only the hand-written Markdown; docs/ is excluded in .rumdl.toml because
      # it is a reproduction of Google's Markdown. llms.txt and llms-full.txt
      # need no entry: rumdl does not discover .txt files. A rule or rule option
      # that rumdl does not recognize in .rumdl.toml is only a warning, and the
      # setting is ignored; --deny-config-warnings fails the step instead.
      - name: Lint Markdown
        run: uv run rumdl check --deny-config-warnings

      - name: Test
        run: uv run pytest

  # prek is not run here: its Ruff, rumdl, and Commitizen hooks would repeat
  # these jobs. Its built-in checks (trailing whitespace, final newlines, YAML
  # syntax) therefore run only where a contributor installed the hooks.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Check commit messages
        run: >
          uv run cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
