# `uv run pre-commit install` sets up both hook types below, so a contributor
# never has to remember --hook-type.
default_install_hook_types: [pre-commit, commit-msg]

# The mirrored guide is reproduced verbatim and must not be touched by any
# fixer. Google's Markdown uses significant trailing spaces and ends without a
# final newline.
exclude: ^(docs/|llms(-full)?\.txt$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep these revs in step with uv.lock, so that the hooks and CI enforce the
  # same versions. `pre-commit autoupdate` bumps them.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      # Python only, by the hook's own file types: `ruff format` also rewrites
      # Python code blocks inside Markdown files.
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.57
    hooks:
      - id: rumdl
        args: [--fix]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.1
    hooks:
      - id: commitizen
