# `uv run pre-commit install` sets up both hook types below, so a contributor
# never has to remember --hook-type.
default_install_hook_types: [pre-commit, commit-msg]

# The mirrored guide is reproduced verbatim and must not be touched by any
# fixer. Google's Markdown uses significant trailing spaces and ends without a
# final newline.
exclude: ^(docs/|llms(-full)?\.txt$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep these revs in step with uv.lock, so that the hooks and CI enforce the
  # same versions. `pre-commit autoupdate` bumps them.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      # Markdown too, by the hook's own file types: like `ruff format` in CI, it
      # formats the Python code blocks of the hand-written Markdown.
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.2
    hooks:
      - id: rumdl
        args: [--fix]
        # rumdl delegates Python code blocks to Ruff, which is not in its
        # isolated environment. Keep this pinned to the ruff-check rev above.
        additional_dependencies: ["ruff==0.17.3"]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
