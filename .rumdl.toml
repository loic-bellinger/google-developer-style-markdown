# Markdown style for the files this project writes by hand, following Google's
# own Markdown style guide: https://google.github.io/styleguide/docguide/style.html
#
# The mirrored guide is deliberately out of scope. docs/ is a reproduction of
# Google's Markdown and must stay byte-identical to the source. Linting it
# reports 4465 violations, and `rumdl fmt` rewrites 67 of the 70 files -- it
# reads the front matter `title:` as a top-level heading and demotes each page's
# real H1 to an H2. Exclusions are used rather than an include list, so a new
# hand-written file is linted by default. llms.txt and llms-full.txt need no
# entry: rumdl only discovers .md and .markdown files.

[global]
exclude = ["docs"]
line_length = 80  # Google: "Wrap to 80 characters"

# Line length: the 80-column rule is about prose. Ruff owns the Python code
# blocks in our Markdown and formats them to 120, so checking them here would be
# a conflict neither tool can resolve. Tables are already exempt by default.
[MD013]
code_blocks = false

# Headings: ATX-style only (# Heading), not Setext (underlines)
[MD003]
style = "atx"

# Lists: the docguide doesn't prescribe a bullet character, but its examples
# use asterisks. Pinning one keeps our own files consistent.
[MD004]
style = "asterisk"

# Lists: 4-space indent for nesting
[MD007]
indent = 4

# Trailing spaces: Google says use backslash for line breaks, not trailing spaces
[MD009]
strict = true

# Lists: Google uses lazy numbering (all 1.) for long lists
# Use "one_or_ordered" to allow both lazy and explicit numbering
[MD029]
style = "one_or_ordered"

# Lists: Google specifies 3 spaces after bullet, 2 after number
# This aligns continuation text with first word
#   *   List item text
#   1.  Numbered item text
[MD030]
ul_single = 3
ul_multi = 3
ol_single = 2
ol_multi = 2

# Code blocks: Fenced (```) preferred over indented
[MD046]
style = "fenced"

# The following rules are enabled by default and match Google's guide:
# - MD018: Space after hash in headings
# - MD022: Blank lines around headings
# - MD025: Single H1 per document
# - MD033: No inline HTML (Google: "Strongly prefer Markdown")
# - MD040: Code blocks should specify language
# - MD047: Files end with single newline
