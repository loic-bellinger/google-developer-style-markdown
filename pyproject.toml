[project]
name = "google-developer-style-markdown"
version = "0.1.0"
description = "Deterministic Markdown mirror of Google's developer documentation style guide, with llms.txt"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Loïc Bellinger", email = "loic.bellinger.pro@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp[speedups]>=3.14.3",
    "selectolax>=0.4.11",
]

[project.urls]
Homepage = "https://github.com/loic-bellinger/google-developer-style-markdown"
Issues = "https://github.com/loic-bellinger/google-developer-style-markdown/issues"

[project.scripts]
gdsm = "google_developer_style_markdown.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.0.1",
    "ruff>=0.16.3",
    "rumdl>=0.2.57",
]

# --- Linting and formatting ---------------------------------------------------
# Ruff 0.16 enables a broad rule set by default, so only the additions are
# listed here. `ruff format` also formats Python code blocks inside Markdown,
# and docs/ is a verbatim reproduction: without this exclusion a plain
# `ruff format .` rewrites Google's code samples in our own style.

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = [
    "D", # pydocstyle: only D419 is on by default
]
ignore = [
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.ruff.format]
quote-style = 'single'

# --- Tests --------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# --- Releases -----------------------------------------------------------------

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
